name: Endurance Simulation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/endurance.mjs'
      - 'scripts/endurance.ts'
      - 'package.json'
      - 'app/page.tsx'
      - '.github/workflows/endurance.yml'
jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/endurance.mjs
      - run: npm run endurance
